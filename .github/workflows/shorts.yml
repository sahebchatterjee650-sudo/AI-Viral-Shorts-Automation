
name: AI Viral Realistic Shorts

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

concurrency:
  group: free-viral-shorts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          ffmpeg -filters | grep subtitles

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Four Shorts
        run: |
          python -u main.py

      - name: Save Generated Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Viral-Shorts-${{ github.run_number }}
          path: output_videos/
          if-no-files-found: warn
          retention-days: 7
